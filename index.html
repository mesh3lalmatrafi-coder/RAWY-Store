<!DOCTYPE htm1>
<html>
<head>
    <title>RAWY Store</title>
<style>
    body {
        background-color: #d8cbb8;
        color: #202020;
    }
h1 {
    text-align: center;
    font-size: 65px;
    margin-top: 95px;
    margin-bottom: 15px;
}
h2 {
    text-align: center;
    font-size: 36px;
    color: #412d03;
}
.brand-story {
    text-align: center;
    color: #412d03;
    font-size: 20px;
    max-width: 490px;
    margin: 20px auto;
}
p {
    text-align: center;
    color: #6b6258;
    font-size: 22px;
    margin-bottom: 35px;
}
button {
    background-color: #322e28;
    color: #e8dfd0;
    padding: 15px 30px;
    border-radius: 12px;
    font-size: 20px;
    display: block;
    margin-left: auto;
    margin-right: 0;
    border: none;
    transition: background-color 0.3s; 
}
button:hover {
    background-color: #6b6258;
}
img {
    display: block;
    margin: 30px 0;
    position: relative;
    top:-350px;
    mix-blend-mode: multiply;
}
a {
    text-decoration: none;
}
</style>
</head>
<body>
    <h1>RAWY</h1>
    <p>Welcome to RAWY Store</p>
    <h2>لكل قطعة حكاية</h2>
    <p class="brand-story">
    في راوي نؤمن أن الأناقة ليست مجرد ما نرتديه
    بل وسيلة نعبّر بها عن هويتنا.
    من تفاصيل مدننا إلى قصصنا اليومية،
    نصنع قطعًا تحمل معنى وتروي حكاية
    </p>
    <a href="shop.html">
        <button>shop now → </button>
    </a>
    <img src="images/shirt-transparent.png" alt="RAWY T-Shirt" width="300">
</body>
</html>
