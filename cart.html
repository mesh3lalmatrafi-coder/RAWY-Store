<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAWY | سلة المشتريات</title>

    <style>
        body {
            background-color: #E8DFD0;
            color: #322E28;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    direction: ltr;
    padding: 10px 25px;
    border-bottom: 5px solid #322E28;
}

nav a {
    display: inline-block;
    padding: 10px 16px;
    margin-left: 8px;
    border-radius: 6px;
    text-decoration: none;
    color: #E8DFD0;
    background-color: #322E28;
}

.cart-title {
    text-align: center;
    font-size: 32px;
    margin-top: 40px;
    color: #322E28;
}

.cart-container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}


.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 25px;
    background-color: #F5F0E8;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #B9A58B;
}

.cart-item img {
    width: 150px;
    height: 170px;
    object-fit: contain;
}

.item-info {
    flex: 1;
}

.item-info h3 {
    margin-top: 0;
    color: #322E28;
}

.item-price {
    font-size: 20px;
    font-weight: bold;
    color: #322E28;
}

.remove-item {
    background-color: #322E28;
    color: #E8DFD0;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
}
.cart-total {
    background-color: #322E28;
    color: #F5F0E8;
    padding: 20px 25px;
    margin: 30px auto;
    max-width: 500px;
    border: 1px solid #D5C8B6;
    border-radius: 12px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.empty-cart {
    background-color: #F5F0E8;
    color: #322E28;
    text-align: center;
    padding: 45px 20px;
    margin: 40px auto;
    max-width: 650px;
    border: 1px solid #D5C8B6;
    border-radius: 12px;
    box-sizing: border-box;
}

.empty-cart h2 {
    margin: 0 0 15px;
    text-align: center;
}

.empty-cart p {
    margin: 0 0 25px;
    color: #756755;
    text-align: center;
}

.empty-cart a {
    display: inline-block;
    background-color: #322E28;
    color: #FFFFFF;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    transition: background-color 0.2s ease;
}

.empty-cart a:hover {
    background-color: #51473C;
}
    </style>
</head>

<body>
<header>
    <h1>RAWY</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
    </nav>
</header>

<main>
    <h2 class="cart-title">سلة المشتريات</h2>

    

<div class="cart-container" id="cart-container">
</div>
<div class="cart-total" id="cart-total-box">
    إجمالي المشتريات: <span id="cart-total">0</span> 
</div>
</main>

<script>
   
const cart = JSON.parse(localStorage.getItem("rawyCart")) || [];
const cartTotal = document.querySelector("#cart-total");
const cartTotalBox = document.querySelector("#cart-total-box");

if (cart.length === 0) {
    cartTotalBox.style.display = "none";
} else {
    const total = cart.reduce(function(sum, product) {
        return sum + Number(product.price);
    }, 0);

    cartTotal.textContent = total;
}
const cartContainer = document.querySelector("#cart-container");

if (cart.length === 0) {
    cartContainer.innerHTML = `
        <div class="empty-cart">
            <h2>سلتك فارغة</h2>
            <p>يبدو أنك لم تضف أي منتجات إلى سلتك بعد.</p>
            <a href="shop.html">تصفح منتجات RAWY</a>
        </div>
    `;
}else {
    cart.forEach(function(product) {
        const item = document.createElement("div");
        item.classList.add("cart-item");

        item.innerHTML = `
            <img src="${product.image}" alt="${product.name}">
            <div class="item-info">
                <h3>${product.name}</h3>
                <p>المقاس: ${product.size}</p>
                <p class="item-price">${product.price} ﷼</p>

            </div>
            <button class="remove-item" onclick="removeItem(${cart.indexOf(product)})">
    حذف المنتج
</button>
        `;

        cartContainer.appendChild(item);
    });
}

function removeItem(index) {
    const cart = JSON.parse(localStorage.getItem("rawyCart")) || [];

    cart.splice(index, 1);

    localStorage.setItem("rawyCart", JSON.stringify(cart));

    location.reload();
}
</script>
</body>
</html>
